# Alembic settings for database migrations.
# Keep this file ASCII: on Windows, Alembic reads it with the system code page.
#
# The server runs migrations by itself on startup (app/database.py).
# This file is only for manual commands, run from artisan-backend/:
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
# The database URL comes from DATABASE_URL (same as the server), not from here.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
